# Console defaults for the SLF4J Simple backend.
# JVM -Dorg.slf4j.simpleLogger.* properties override this file.
# --verbose / -v and the supported debug environment variables select DEBUG.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=false
# Suppress typography fallback messages, including in verbose mode.
org.slf4j.simpleLogger.log.com.itextpdf.layout.renderer.typography.DefaultTypographyApplier=off
org.slf4j.simpleLogger.log.com.itextpdf.html2pdf.attach.impl.tags.ThTagWorker=off
org.slf4j.simpleLogger.log.com.itextpdf.styledxmlparser.css.parse.syntax.CssParserStateController=off
org.slf4j.simpleLogger.log.com.itextpdf.kernel.colors.gradients.LinearGradientBuilder=off