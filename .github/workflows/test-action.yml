name: Test itext-markdown2pdf action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml zip
          shellcheck --severity=warning scripts/*.sh

      - name: Validate action.yml is parseable
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml'))"

      - name: Files must be executable
        run: |
          for f in scripts/*.sh bin/itext-markdown2pdf; do
            test -x "$f" || { echo "::error::$f is not executable (git update-index --chmod=+x $f)"; exit 1; }
          done

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  self-test:
    name: Run the action against itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare nested Markdown and PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils unzip
          mkdir -p 'test-input/nested folder'
          cp test-fixtures/sample.md test-input/sample.md
          cp test-fixtures/sample.md 'test-input/nested folder/second file.md'

      - name: Convert a folder
        id: folder
        uses: ./
        with:
          input: 'test-input'
          output: 'test-output/documents.zip'

      - name: Convert a single file
        id: single
        uses: ./
        with:
          input: 'test-fixtures/sample.md'
          output: 'test-output/sample.pdf'

      - name: Validate files and action outputs
        env:
          ZIP_PATH: ${{ steps.folder.outputs.output-path }}
          ZIP_TYPE: ${{ steps.folder.outputs.output-type }}
          ZIP_COUNT: ${{ steps.folder.outputs.pdf-count }}
          PDF_PATH: ${{ steps.single.outputs.output-path }}
          PDF_TYPE: ${{ steps.single.outputs.output-type }}
          PDF_COUNT: ${{ steps.single.outputs.pdf-count }}
        run: |
          test "$ZIP_TYPE" = zip && test "$ZIP_COUNT" = 2
          test "$PDF_TYPE" = pdf && test "$PDF_COUNT" = 1
          test "$ZIP_PATH" = "$GITHUB_WORKSPACE/test-output/documents.zip"
          test "$PDF_PATH" = "$GITHUB_WORKSPACE/test-output/sample.pdf"
          python3 - <<'PY'
          import os
          import zipfile
          with zipfile.ZipFile(os.environ['ZIP_PATH']) as archive:
              assert archive.testzip() is None
              assert set(archive.namelist()) == {'sample.pdf', 'nested folder/second file.pdf'}
              assert all(archive.read(name).startswith(b'%PDF-') for name in archive.namelist())
          PY
          unzip -q "$ZIP_PATH" -d test-output-unpacked
          for pdf in "$PDF_PATH" test-output-unpacked/sample.pdf 'test-output-unpacked/nested folder/second file.pdf'; do
            pdfinfo "$pdf"
            pdftotext "$pdf" - | grep 'Sample document'
          done

      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: self-test-output
          if-no-files-found: error
          path: |
            ${{ steps.folder.outputs.output-path }}
            ${{ steps.single.outputs.output-path }}
